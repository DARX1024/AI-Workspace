<style>

"use strict";
const rows = 4, cols = 5;
const has = (board, i) => (board >>> i) & 1;

const floorBits = (board, row) => (board >>> (row * cols)) & 31;
const letters = [
  {
    name:"末班车", title:"给小姜的四级台阶", time:"19:42", sky:"日暮",
    body:"小姜第一次开夜班。她说，拐弯时看见我们楼上的灯像一级级台阶，就知道再往前一点，该轻轻踩刹车了。",
    from:"终点站卖报的阿容", order:"从左上往右下，依次点亮 A4、B3、C2、D1 四扇窗。", unit:"级台阶", total:4,
    reply:"车靠站时，最后一排的小孩还睡着。小姜托我告诉楼上，她今天刹得很轻。",
    start:["01001","10010","00101","01010"],
    score:board => [0,6,12,18].reduce((n,i) => n + has(board,i),0)
  },
  {
    name:"隔墙练琴", title:"今晚借半首曲子", time:"21:16", sky:"入夜",
    body:"我家只有琴的左半边响，隔壁刚好相反。楼上几户听说了，也想这么试试。劳驾，每层给我们留一对挨着的窗。",
    from:"三楼修手风琴的老吴", order:"每层的两扇亮窗都要左右相邻。最左与最右之间隔着一整层楼。", unit:"对邻窗", total:4,
    reply:"二楼慢了一拍。我们停下来等，楼上的人还在弹。头一次知道，一首曲子可以在楼里迷路。",
    start:["10010","01001","01010","10100"],
    score:board => Array.from({length:rows},(_,r) => floorBits(board,r)).filter(f => (f & (f << 1)) !== 0).length
  },
  {
    name:"水中合影", title:"请把倒影寄给我", time:"23:08", sky:"雨后",
    body:"我在楼对面摆过四十年馄饨摊。小时候以为，往洼地里扔块石子，楼上的人就会晃。临搬走，想让楼下两层也当一回倒影。",
    from:"刚收起最后一只碗的桂姨", order:"让一楼照着四楼亮，二楼照着三楼亮。横着对折，十对窗都要同亮或同暗。", unit:"对重合", total:10,
    reply:"照片洗了两张。女儿把其中一张上下颠倒贴在冰箱上。我路过几回都没发觉，倒是想伸手，替照片里的人扶一扶碗。",
    start:["11100","01010","10001","00111"],
    score:board => Array.from({length:2*cols},(_,i) => i).filter(i => has(board,i)===has(board,(rows-1-Math.floor(i/cols))*cols+i%cols)).length
  }
];
const rectangles = [];
for(let top=0;top<rows;top++) for(let bottom=top+1;bottom<rows;bottom++) {
  for(let left=0;left<cols;left++) for(let right=left+1;right<cols;right++) {
    const a=top*cols+left, b=top*cols+right, c=bottom*cols+left, d=bottom*cols+right;
    const slash=bit(b)|bit(c), backslash=bit(a)|bit(d);
    rectangles.push({slash,backslash,mask:slash|backslash,pairs:[[b,c],[a,d]]});
  }
}
function swapFor(board,a,b) {
  if(a === b || !has(board,a) || !has(board,b)) return null;
  const selected=bit(a)|bit(b);
  return rectangles.find(r => (r.slash===selected || r.backslash===selected) && (board & r.mask)===selected);
}
// Breadth-first search carries the first pair of each path back to the player.
function hintFor(board,letter) {
  if(letter.score(board)===letter.total) return null;
  const queue=[{board,first:null}], seen=new Set([board]);
  for(let head=0;head<queue.length;head++) {
    const item=queue[head];
    for(const r of rectangles) {
      const overlap=item.board & r.mask;
      if(overlap!==r.slash && overlap!==r.backslash) continue;
      const next=item.board ^ r.mask;
      if(seen.has(next)) continue;
      const first=item.first || r.pairs[Number(overlap===r.backslash)];
      if(letter.score(next)===letter.total) return first;
      seen.add(next);
      queue.push({board:next,first});
    }
  }
  return null;
}

    box(x|0,y|0,random()<.2?4:1,1,k%3?"#554f5526":"#ddbaa03b");
  }
  for(let c=0;c<cols;c++) label("ABCDE"[c],glass.x+glass.dx*c+23,138,"#ffebce",15);
  for(let r=0;r<rows;r++) {
    const y=glass.y+r*glass.dy+18;
    box(96,y-11,27,18,iron); box(97,y-10,25,1,"#ba9c84"); label((rows-r)+"F",110,y+3,"#ffebce",13);
  }
  for(let i=0;i<rows*cols;i++) drawWindow(i,has(board,i));
  for(const x of [132,508]) {
    box(x,116,3,273,"#5b5c60"); box(x,116,1,273,"#b09381");
    for(let y=132;y<390;y+=48) box(x-1,y,5,2,"#444e55");
  }
  // Street level, with a shop front, a folded awning and a bicycle.
  box(0,395,640,51,"#39494d"); box(120,386,402,7,"#3a464c"); box(124,393,394,38,"#655e5c");
  box(140,395,69,35,"#34454b"); box(148,399,24,31,"#526064"); box(176,399,24,31,"#4a585e");
  box(260,392,106,37,"#b49677"); box(265,395,96,31,"#575e60");
  for(let k=0;k<9;k++) box(265,396+k*3,96,1,"#76807b");
  poly([[253,387],[371,387],[378,398],[247,398]],"#c4a082");
  for(let k=0;k<8;k++) poly([[255+k*15,387],[261+k*15,387],[262+k*15,398],[252+k*15,398]],"#97685a");
  box(385,391,66,39,"#3b494b"); box(390,396,24,26,"#ab8568"); box(419,396,27,26,"#ba926e");
  box(462,396,40,32,"#746f6a"); box(466,399,32,26,"#5b6161");
  box(0,430,640,40,night===2?"#414e57":"#545859"); box(0,430,640,2,"#a08a78"); box(0,437,640,2,"#394b50");
  for(let k=0;k<(night===2?100:35);k++) { const x=random()*640,y=440+random()*29; box(x|0,y|0,2+random()*18,1,k%4===0?"#ad927a84":"#7b82824d"); }
  for(const x of [65,80,91,486,501,516]) plant(x,425,.7+(x%7)*.08,"#384d47");
  bicycle(220,421);
  // A seated cat at the warm shop window.
  poly([[426,426],[425,421],[429,415],[429,408],[433,411],[437,408],[438,417],[441,424],[440,426]],"#304047");
  arcwire(438,425,448,431,450,421,"#304047",2);
  box(43,159,5,272,iron); box(35,157,22,3,iron);
  arcwire(-3,153,16,160,46,157,iron,1.5); arcwire(46,157,82,173,115,155,iron,1.5);
  arcwire(528,126,578,150,644,99,iron,1.5); arcwire(527,133,581,157,644,104,iron);
  for(let k=0;k<2600;k++) box(random()*640|0,random()*470|0,1,1,k%2?"#fbe9d51b":"#172e4119");
}
</script>
<script>
const byId=id=>document.getElementById(id);
const sessions=letters.map(letter=>({board:pack(letter.start),history:[]}));
const nav=[], panes=[];
let current=0, chosen=null, hinted=null, focusCell=1;
const currentLetter=()=>letters[current];
const session=()=>sessions[current];
const finished=index=>letters[index].score(sessions[index].board)===letters[index].total;
const directions="先选两扇位于不同层、不同列的亮窗。另两个角都暗着时，灯就能换过去。";
function setFeedback(message) { byId("feedback").textContent=message; }
function refresh(message=directions) {
  const letter=currentLetter(), {board,history}=session(), score=letter.score(board), done=finished(current);
  drawStreet(board,current);
  nav.forEach((button,i)=>{
    button.setAttribute("aria-current",String(i===current)); button.dataset.done=String(finished(i));
    button.setAttribute("aria-label",letters[i].name+(finished(i)?"，已收到回信":"，来信"));
  });
  panes.forEach((pane,i)=>{
    const possible=chosen!==null && Boolean(swapFor(board,chosen,i));
    pane.classList.toggle("chosen",chosen===i); pane.classList.toggle("possible",possible);
    pane.classList.toggle("hinted",Boolean(hinted?.includes(i)));
    pane.setAttribute("aria-label",address(i)+(has(board,i)?"，亮窗":"，暗窗")+(possible?"，可与选中的窗交换":""));
    pane.setAttribute("aria-pressed",String(chosen===i)); pane.tabIndex=i===focusCell?0:-1;
  });
  byId("postmark").textContent=done?"寄回收发室 · 回信":"寄到收发室 · 来信";
  byId("subject").textContent=letter.title;
  byId("letterBody").textContent=done?letter.reply:letter.body;
  byId("signed").textContent="——"+letter.from;
  byId("orderHeading").textContent=done?"信里托办的事，办妥了":"信里托办的事";
  byId("order").textContent=letter.order; byId("mobileOrder").textContent=letter.order;
  byId("fill").style.width=(score/letter.total*100)+"%";
  byId("count").textContent=score+" / "+letter.total+" "+letter.unit;
  byId("time").textContent=letter.time+" · "+letter.sky;
  byId("streetTitle").textContent="海棠里七号楼 · 临街面";
  byId("moves").textContent="已换 "+history.length+" 次";
  byId("undo").disabled=!history.length; byId("hint").disabled=done;
  byId("reset").disabled=!history.length && chosen===null && hinted===null;
  byId("next").hidden=!done || letters.every((_,i)=>finished(i));
  byId("print").hidden=!done;
  setFeedback(message);
}
function clearChoice() { chosen=null; hinted=null; }
function arrival() {
  return letters.every((_,i)=>finished(i))?"三封回信都到了。挑一幅喜欢的窗景，可以印成明信片。":"楼下送来了回信。";
}
function openLetter(index) {
  current=index; clearChoice();
  focusCell=Array.from({length:rows*cols},(_,i)=>i).find(i=>has(session().board,i));
  refresh(finished(index)?arrival():directions);
}
function pick(i) {
  const state=session();
  if(finished(current)) { setFeedback(arrival()); return; }
  focusCell=i;
  if(!has(state.board,i)) { refresh(chosen===null?"这扇窗里灯是暗的。先选一扇亮窗。":"第二扇也要亮着。虚线框出了能换的位置。"); return; }
  if(i===chosen) { clearChoice(); refresh(); return; }
  if(chosen===null) {
    chosen=i; if(!hinted?.includes(i)) hinted=null;
    const available=panes.filter((_,j)=>swapFor(state.board,i,j)).length;
    refresh(available?"已选 "+address(i)+"。再点一扇虚线亮窗，两户就会交换窗位。":"从 "+address(i)+" 暂时换不出去。再点一次可以松开它。");
    return;
  }
  const rect=swapFor(state.board,chosen,i);
  if(!rect) { refresh("这两扇窗换不了。请选虚线亮窗，或再点 "+address(chosen)+" 取消选择。"); return; }
  const first=address(chosen);
  state.history.push(state.board); state.board^=rect.mask; clearChoice();
  refresh(finished(current)?arrival():first+" 和 "+address(i)+" 已交换窗位。每层、每列的灯数都和原来一样。");
}
letters.forEach((letter,i)=>{
  const button=document.createElement("button"); button.textContent=letter.name;
  button.addEventListener("click",()=>openLetter(i)); byId("letters").append(button); nav.push(button);
});
for(let i=0;i<rows*cols;i++) {
  const pane=document.createElement("button"),c=i%cols,r=Math.floor(i/cols);
  pane.className="pane"; pane.title=address(i);
  pane.style.left=((glass.x+c*glass.dx-10)/640*100)+"%"; pane.style.top=((glass.y+r*glass.dy-9)/470*100)+"%";
  pane.style.width=((glass.w+20)/640*100)+"%"; pane.style.height=((glass.h+20)/470*100)+"%";
  pane.addEventListener("click",()=>pick(i));
  pane.addEventListener("keydown",event=>{
    const target={ArrowUp:Math.max(0,r-1)*cols+c,ArrowDown:Math.min(rows-1,r+1)*cols+c,
      ArrowLeft:r*cols+Math.max(0,c-1),ArrowRight:r*cols+Math.min(cols-1,c+1)}[event.key];
    if(target!==undefined) {
      event.preventDefault(); panes[focusCell].tabIndex=-1; focusCell=target; panes[target].tabIndex=0; panes[target].focus();
    } else if(event.key==="Escape") { clearChoice(); refresh(finished(current)?arrival():directions); }
  });
  byId("windows").append(pane); panes.push(pane);
}
byId("hint").addEventListener("click",()=>{
  chosen=null; hinted=hintFor(session().board,currentLetter());
  refresh(hinted?"试试 "+address(hinted[0])+" 和 "+address(hinted[1])+"。点这两扇带点线的亮窗。":directions);
});
byId("undo").addEventListener("click",()=>{
  const state=session(); if(!state.history.length) return;
  state.board=state.history.pop(); clearChoice(); refresh("上一对灯已换回。");
});
byId("reset").addEventListener("click",()=>{
  const state=session(); state.board=pack(currentLetter().start); state.history.length=0; openLetter(current);
});
byId("next").addEventListener("click",()=>{
  for(let step=1;step<letters.length;step++) {
    const index=(current+step)%letters.length;
    if(!finished(index)) { openLetter(index); nav[index].focus(); break; }
  }
});
byId("print").addEventListener("click",()=>window.print());
openLetter(0);
</script>
